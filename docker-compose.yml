services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_BOOKING_API_URL=http://localhost:8787
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - ./worker/src:/app/src
      - ./worker/.dev.vars:/app/.dev.vars
