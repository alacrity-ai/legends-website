name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BOOKING_API_URL: ${{ secrets.VITE_BOOKING_API_URL }}
          VITE_YOUTUBE_VIDEO_ID: ${{ secrets.VITE_YOUTUBE_VIDEO_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name legends-website
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Install admin dependencies
        run: cd admin && npm ci

      - name: Build admin PWA
        run: cd admin && npm run build

      - name: Deploy admin PWA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: pages deploy dist --project-name legends-admin
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Deploy booking worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
