name = "legends-booking-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

# Production route — uncomment and deploy once worker is ready
[[routes]]
pattern = "djkmdlegends.com/api/*"
zone_name = "djkmdlegends.com"

[[kv_namespaces]]
binding = "MAILING_LIST"
id = "87b3a569d4e145a4a7458c26d88ad8fa"
preview_id = "006ad453ff844658bc33c7285f2bdc35"

[[kv_namespaces]]
binding = "GUESTLIST"
id = "b52560156960470db4af905dc2e82f5d"
preview_id = "751f392d15924b5dbd77ad634eb4ab11"

# Custom events created via the admin Event Form (v0.2).
# Create with:
#   npx wrangler kv namespace create EVENTS
#   npx wrangler kv namespace create EVENTS --preview
# then paste the printed ids below.
[[kv_namespaces]]
binding = "EVENTS"
id = "b756d4fef5c44daca7c6320c8171faf1"
preview_id = "c245b1434f82410aafc854b1531adb66"

# Show images uploaded via the admin Event Form (v0.2).
# Create with: npx wrangler r2 bucket create legends-event-images
[[r2_buckets]]
binding = "EVENT_IMAGES"
bucket_name = "legends-event-images"
preview_bucket_name = "legends-event-images"

[vars]
BOOKING_EMAIL = "booking@djkmdlegends.com"
ALLOWED_ORIGINS = "https://djkmdlegends.com,https://www.djkmdlegends.com,http://localhost:5173"
GOOGLE_CALENDAR_ID = "c_f31ec573a399824b85486344a243eb27e6742ef72157c2240a8723ad89987594@group.calendar.google.com"
# Square: API base is selected by this var. Real token/location are secrets (wrangler secret put).
SQUARE_ENVIRONMENT = "production"
# Legacy Google Calendar event reading. Keep "true" through the grandfathering window
# (the 2 existing calendar shows with live bookings), then flip to "false" at cutover (~Sept 2026).
LEGACY_CALENDAR_ENABLED = "false"
